<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes — API Client</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p class="subtitle">Front end for the QuickNotes API (using JSONPlaceholder for practice)</p>
  </header>

  <main>
    <!-- Load notes section -->
    <section id="load-section">
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <!-- Create note section -->
    <section id="create-section">
      <h2>Create a note</h2>
      <form id="note-form" novalidate>
        <div class="field">
          <label for="title-input">Title <span class="required">*</span></label>
          <input
            type="text"
            id="title-input"
            name="title"
            maxlength="100"
            required
            placeholder="Up to 100 characters"
          />
          <p class="field-error" id="title-error" hidden>Title is required (max 100 characters).</p>
        </div>

        <div class="field">
          <label for="body-input">Body</label>
          <textarea
            id="body-input"
            name="body"
            rows="4"
            placeholder="Optional note body"
          ></textarea>
        </div>

        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <!-- Notes list -->
    <section id="list-section">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <script src="api.js" defer></script>
</body>
</html>
